<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кошка бежит</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1c1612;
    font-family: "Segoe UI", sans-serif;
    color: #2a2118;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }
  .stage {
    position: relative;
    width: min(1100px, 100vw);
    aspect-ratio: 16 / 9;
    max-height: 100vh;
  }
  canvas {
    touch-action: none;
    width: 100%;
    height: 100%;
    display: block;
    background: #e7d3b4;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .hud, .panel {
    position: absolute;
    pointer-events: none;
  }
  .hud {
    top: 18px;
    left: 22px;
    right: 22px;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    letter-spacing: .04em;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .hud b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .hud span { display: block; font-size: 12px; font-weight: 600; opacity: .7; letter-spacing: .14em; text-transform: uppercase; }
  .panel {
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
  }
  .card {
    pointer-events: auto;
    text-align: center;
    background: rgba(255,248,238,.92);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 18px;
    padding: 28px 36px 24px;
    box-shadow: 0 12px 40px rgba(70,40,10,.18);
    max-width: 420px;
  }
  h1 { margin: 0 0 8px; font-size: 34px; font-weight: 800; }
  p { margin: 0; line-height: 1.45; }
  .hint {
    margin-top: 14px;
    display: inline-block;
    background: #2a2118;
    color: #f6efe4;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
  }
  kbd {
    font-family: inherit;
    border-bottom: 2px solid #c9a27a;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="hud">
      <div><span>Счёт</span><b id="score">0</b></div>
      <div style="text-align:right"><span>Рекорд</span><b id="best">0</b></div>
    </div>
    <div class="panel" id="start">
      <div class="card">
        <h1>Кошка бежит</h1>
        <p>Паркет уходит назад, коробки и цветы лезут под лапы.</p>
        <div class="hint"><kbd>Пробел</kbd> или касание — прыжок</div>
      </div>
    </div>
    <div class="panel hidden" id="over">
      <div class="card">
        <h1>Столкновение</h1>
        <p id="over-text">Кошка врезалась.</p>
        <div class="hint"><kbd>Пробел</kbd> — ещё раз</div>
      </div>
    </div>
  </div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const startEl = document.getElementById("start");
const overEl = document.getElementById("over");
const overText = document.getElementById("over-text");

const W = 960;
const H = 540;
const GROUND = 430;

const BEST_KEY = "cat-run-best";
let best = Number(localStorage.getItem(BEST_KEY) || 0);
bestEl.textContent = best;

const catImg = new Image();
catImg.src = "cat.png";

const G = 2000;
const JUMP_V = -920;
const COYOTE = 0.12;
const BUFFER = 0.14;

const state = {
  mode: "start",
  t: 0,
  dist: 0,
  speed: 340,
  catY: 0,
  catV: 0,
  onGround: true,
  coyote: 0,
  buffer: 0,
  holding: false,
  obstacles: [],
  dust: [],
  spawnIn: 0,
  score: 0,
  shake: 0,
  startedAt: 0
};

const CAT_W = 220;
const CAT_H = 145;

// A distance-driven gait keeps planted paws moving at the floor's speed.
const STRIDE = 190;
let landingSquash = 0;

function reset() {
  state.t = 0;
  state.dist = 0;
  state.speed = 340;
  state.catY = 0;
  state.catV = 0;
  state.onGround = true;
  state.coyote = 0;
  state.buffer = 0;
  state.obstacles = [];
  state.dust = [];
  state.spawnIn = 0.4;
  state.score = 0;
  state.shake = 0;
  state.holding = false;
  landingSquash = 0;
  scoreEl.textContent = "0";
}

function jump() {
  if (state.mode !== "play") return;
  if (state.onGround || state.coyote > 0) {
    state.catV = JUMP_V;
    state.onGround = false;
    state.coyote = 0;
    state.buffer = 0;
    blip(520, 0.07);
  } else {
    state.buffer = BUFFER;
  }
}

function startGame() {
  reset();
  state.mode = "play";
  startEl.classList.add("hidden");
  overEl.classList.add("hidden");
}

function die() {
  state.mode = "over";
  state.shake = 1;
  state.catV = Math.min(state.catV, -200);
  blip(90, 0.18, "sawtooth");
  if (state.score > best) {
    best = state.score;
    localStorage.setItem(BEST_KEY, String(best));
    bestEl.textContent = best;
  }
  overText.textContent = state.score > 0
    ? "Пробежала " + state.score + " м. Рекорд: " + best + " м."
    : "Даже с места не вышло. Рекорд: " + best + " м.";
  overEl.classList.remove("hidden");
}

function pressJump() {
  if (!jumpArmed) return;
  jumpArmed = false;
  state.holding = true;
  if (state.mode === "start" || state.mode === "over") startGame();
  else jump();
}
function releaseJump() {
  jumpArmed = true;
  state.holding = false;
  if (state.mode === "play" && state.catV < -640) state.catV = -640;
}
window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    pressJump();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") releaseJump();
});
document.querySelector(".stage").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  pressJump();
});
window.addEventListener("pointerup", releaseJump);
window.addEventListener("pointercancel", releaseJump);
window.addEventListener("blur", releaseJump);

function spawnObstacle() {
  const roll = Math.random();
  let o;
  if (roll < 0.22) o = { kind: "yarn", w: 34, h: 34 };
  else if (roll < 0.42) o = { kind: "books", w: 70, h: 38 };
  else if (roll < 0.68) o = { kind: "box", w: 52, h: 56 };
  else if (roll < 0.86) o = { kind: "plant", w: 46, h: 78 };
  else o = { kind: "stool", w: 64, h: 48 };
  o.x = W + 20;
  if (state.score > 180 && Math.random() < 0.35) {
    o.h += 10;
  }
  state.obstacles.push(o);
  const gap = Math.max(240, 460 - state.score * 0.7);
  state.spawnIn = (gap + Math.random() * 120) / state.speed;
}

function catBox() {
  const x = 118;
  const y = GROUND - CAT_H - state.catY;
  return {
    x: x + CAT_W * 0.18,
    y: y + CAT_H * 0.35,
    w: CAT_W * 0.58,
    h: CAT_H * 0.60
  };
}

function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(dt) {
  landingSquash = Math.max(0, landingSquash - dt * 5);
  state.t += dt;
  state.speed = Math.min(640, 340 + state.dist * 0.035);
  state.dist += state.speed * dt;
  const score = Math.floor(state.dist / 48);
  if (score !== state.score) {
    state.score = score;
    scoreEl.textContent = score;
  }

  state.coyote = state.onGround ? COYOTE : Math.max(0, state.coyote - dt);
  if (state.buffer > 0) {
    state.buffer -= dt;
    if (state.onGround || state.coyote > 0) jump();
  }

  state.catV += G * dt;
  state.catY += -state.catV * dt;
  if (state.catY <= 0) {
    if (!state.onGround && state.mode === "play") {
      puff(168, GROUND - 4, 5);
      landingSquash = 1;
    }
    state.catY = 0;
    state.catV = 0;
    state.onGround = true;
  } else {
    state.onGround = false;
  }

  if (state.onGround && state.mode === "play" && Math.random() < dt * 14) {
    puff(150 + Math.random() * 40, GROUND - 2, 1);
  }

  state.spawnIn -= dt;
  if (state.spawnIn <= 0) spawnObstacle();

  const box = catBox();
  for (const o of state.obstacles) {
    o.x -= state.speed * dt;
    const ob = { x: o.x + 6, y: GROUND - o.h, w: o.w - 12, h: o.h - 4 };
    if (hit(box, ob)) {
      die();
      break;
    }
  }
  state.obstacles = state.obstacles.filter((o) => o.x > -120);

  for (const p of state.dust) {
    p.x -= (state.speed * 0.35 + p.vx) * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  state.dust = state.dust.filter((p) => p.life > 0);
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 2.2);
}

function puff(x, y, n) {
  for (let i = 0; i < n; i++) {
    state.dust.push({
      x, y,
      vx: 20 + Math.random() * 40,
      vy: -20 - Math.random() * 50,
      life: 0.35 + Math.random() * 0.25,
      r: 2 + Math.random() * 3
    });
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, "#f4ecdf");
  g.addColorStop(0.55, "#e7d7c3");
  g.addColorStop(1, "#ddc9ae");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const shaftX = 250 - (state.dist * 0.05) % 40;
  const shaft = ctx.createLinearGradient(shaftX, 0, shaftX + 180, GROUND);
  shaft.addColorStop(0, "rgba(255,244,214,0.55)");
  shaft.addColorStop(1, "rgba(255,244,214,0)");
  ctx.fillStyle = shaft;
  ctx.beginPath();
  ctx.moveTo(shaftX, 0);
  ctx.lineTo(shaftX + 70, 0);
  ctx.lineTo(shaftX + 210, GROUND);
  ctx.lineTo(shaftX + 90, GROUND);
  ctx.fill();

  ctx.fillStyle = "#f7f1e8";
  ctx.fillRect(0, GROUND - 18, W, 18);
  ctx.fillStyle = "#efe4d4";
  ctx.fillRect(0, GROUND - 18, W, 3);

  const plank = 92;
  const shift = state.dist % plank;
  for (let x = -plank; x < W + plank; x += plank) {
    const px = x - shift;
    const wood = ctx.createLinearGradient(0, GROUND, 0, H);
    wood.addColorStop(0, (Math.floor((x / plank)) % 2 === 0) ? "#d7b48a" : "#e0c096");
    wood.addColorStop(1, "#c49a6a");
    ctx.fillStyle = wood;
    ctx.fillRect(px, GROUND, plank - 3, H - GROUND);
    ctx.strokeStyle = "rgba(120,80,40,0.18)";
    ctx.strokeRect(px + 0.5, GROUND + 0.5, plank - 4, H - GROUND);
  }
}

function drawObstacle(o) {
  const x = o.x;
  const y = GROUND - o.h;
  ctx.save();
  if (o.kind === "box") {
    ctx.fillStyle = "#c6884a";
    roundRect(x, y, o.w, o.h, 4);
    ctx.fillStyle = "#a86d34";
    ctx.fillRect(x, y + 8, o.w, 8);
    ctx.strokeStyle = "rgba(90,50,20,.35)";
    ctx.strokeRect(x + 6, y + 18, o.w - 12, o.h - 28);
  } else if (o.kind === "plant") {
    ctx.fillStyle = "#b8613a";
    roundRect(x + 6, y + o.h - 28, o.w - 12, 28, 4);
    ctx.fillStyle = "#2f6b3a";
    ctx.beginPath();
    ctx.ellipse(x + o.w / 2, y + 26, 16, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#3e8a48";
    ctx.beginPath();
    ctx.ellipse(x + o.w / 2 - 10, y + 34, 10, 16, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + o.w / 2 + 12, y + 32, 9, 15, 0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (o.kind === "books") {
    const colors = ["#8c3d32", "#315c7a", "#c4a15a", "#6d4a34"];
    let bx = x;
    colors.forEach((c, i) => {
      const bw = i === 3 ? o.w - (bx - x) : 16;
      ctx.fillStyle = c;
      ctx.fillRect(bx, y + (i % 2) * 3, bw, o.h - (i % 2) * 3);
      bx += bw + 1;
    });
  } else if (o.kind === "yarn") {
    ctx.fillStyle = "#b94b45";
    ctx.beginPath();
    ctx.arc(x + o.w / 2, y + o.h / 2 + 2, o.w / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,220,200,.55)";
    ctx.beginPath();
    ctx.arc(x + o.w / 2, y + o.h / 2 + 2, o.w / 4, 0.4, 2.2);
    ctx.stroke();
  } else {
    ctx.fillStyle = "#6e543c";
    roundRect(x, y + 10, o.w, o.h - 10, 6);
    ctx.fillStyle = "#8a6b4c";
    ctx.fillRect(x + 4, y, 8, 16);
    ctx.fillRect(x + o.w - 12, y, 8, 16);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function ellipse(x, y, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function furStroke(points, width, far = false) {
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const shade = ctx.createLinearGradient(0, -110, 0, 0);
  shade.addColorStop(0, far ? "#463226" : "#71503a");
  shade.addColorStop(0.6, far ? "#6d5039" : "#aa8056");
  shade.addColorStop(1, far ? "#826246" : "#bc956a");
  ctx.strokeStyle = shade;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (const p of points.slice(1)) ctx.lineTo(p.x, p.y);
  ctx.stroke();
  if (catImg.complete && catImg.naturalWidth) {
    // Texture each bone in its own coordinates so the fur bends with it.
    for (let i = 1; i < points.length; i++) {
      const from = points[i - 1], to = points[i];
      const length = Math.hypot(to.x - from.x, to.y - from.y);
      const r = width / 2;
      ctx.save();
      ctx.translate(from.x, from.y);
      ctx.rotate(Math.atan2(to.y - from.y, to.x - from.x));
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(length, -r);
      ctx.arc(length, 0, r, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(0, r);
      ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(catImg, 165, 70, 110, 67, -r, -r, length + width, width);
      ctx.fillStyle = far ? "rgba(28,21,17,0.32)" : "rgba(189,144,88,0.12)";
      ctx.fillRect(-r, -r, length + width, width);
      ctx.restore();
    }
  }
}

function drawLeg(hipX, hipY, phase, hind, far, airborne) {
  const cycle = ((phase % 1) + 1) % 1;
  let footX, footY;
  if (airborne) {
    // Fold on ascent, then reach for the ground before landing.
    const reach = state.mode === "over" ? 0.25
      : Math.max(0, Math.min(1, state.catV / 700));
    footX = hipX + (hind ? -25 : 24) * (1 - reach)
      + (hind ? -14 : 17) * reach + (far ? -8 : 0);
    footY = -36 * (1 - reach) - 7 * reach;
  } else if (state.mode === "play") {
    const stance = 0.42;
    const sweep = STRIDE * stance;
    if (cycle < stance) {
      footX = hipX + sweep / 2 - cycle * STRIDE;
      footY = -4;
    } else {
      const swing = (cycle - stance) / (1 - stance);
      const eased = swing * swing * (3 - 2 * swing);
      footX = hipX - sweep / 2 + sweep * eased;
      footY = -4 - Math.sin(swing * Math.PI) * (hind ? 38 : 32);
    }
  } else {
    footX = hipX + (hind ? -12 : 6);
    footY = -4;
  }

  // Two-bone inverse kinematics: joints bend while the foot follows its arc.
  const upper = hind ? 47 : 43;
  const lower = 46;
  const dx = footX - hipX, dy = footY - hipY;
  const distance = Math.max(1, Math.min(upper + lower - 0.01, Math.hypot(dx, dy)));
  const direction = Math.atan2(dy, dx);
  const bend = Math.acos(Math.max(-1, Math.min(1,
    (upper * upper + distance * distance - lower * lower) / (2 * upper * distance))));
  const angle = direction + (hind ? 1 : -1) * bend;
  const joint = { x: hipX + Math.cos(angle) * upper, y: hipY + Math.sin(angle) * upper };
  const hip = { x: hipX, y: hipY };
  const foot = { x: footX, y: footY };
  furStroke([hip, joint], hind ? 25 : 18, far);
  furStroke([joint, foot], 13, far);
  // Coat bands follow each lower leg instead of sliding over the sprite.
  for (const t of [0.24, 0.49, 0.72]) {
    const x = joint.x + (foot.x - joint.x) * t;
    const y = joint.y + (foot.y - joint.y) * t;
    const a = Math.atan2(foot.y - joint.y, foot.x - joint.x);
    ctx.strokeStyle = far ? "rgba(35,25,20,0.6)" : "rgba(49,34,26,0.5)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - Math.sin(a) * 5, y + Math.cos(a) * 5);
    ctx.lineTo(x + Math.sin(a) * 5, y - Math.cos(a) * 5);
    ctx.stroke();
  }
  furStroke([{ x: footX - 2, y: footY }, { x: footX + 9, y: footY }], 10, far);
}

function drawTail(phase, bodyY, airborne) {
  const points = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    points.push({
      x: 42 - t * 82 + Math.sin(t * Math.PI) * 9,
      y: bodyY - 4 - t * (airborne ? 34 : 52)
        + Math.sin(phase * Math.PI * 2 - t * 4) * (4 + t * 9)
    });
  }
  furStroke(points, 14);
  for (let i = 2; i < points.length - 1; i += 4) {
    ctx.strokeStyle = "#49352b";
    ctx.lineWidth = 14 - i / 7;
    ctx.beginPath();
    ctx.moveTo(points[i].x, points[i].y);
    ctx.lineTo(points[i + 1].x, points[i + 1].y);
    ctx.stroke();
  }
}

function drawCat() {
  const running = state.mode === "play" && state.onGround;
  const airborne = !state.onGround || state.mode === "over";
  const phase = running ? state.dist / STRIDE : state.t * 0.7;
  const bounce = running ? Math.cos(phase * Math.PI * 4) * 3.2
    : Math.sin(state.t * 2.5) * 1.2;
  const bodyY = -78 + bounce + landingSquash * 8;

  // The shadow stays on the floor when the cat jumps.
  ctx.save();
  ctx.translate(118, GROUND);
  const shadowScale = 1 - Math.min(0.5, state.catY / 450);
  ellipse(110, 4, 91 * shadowScale, 9 * shadowScale,
    `rgba(65,39,19,${0.19 - Math.min(0.12, state.catY / 1800)})`);
  ctx.translate(0, -state.catY);
  drawTail(phase, bodyY, airborne);
  drawLeg(62, bodyY + 6, phase + 0.48, true, true, airborne);
  drawLeg(155, bodyY + 7, phase + 0.63, false, true, airborne);

  ctx.save();
  ctx.translate(99, bodyY);
  ctx.rotate(airborne ? Math.max(-0.1, Math.min(0.1, state.catV / 8000)) : Math.sin(phase * Math.PI * 2) * 0.015);
  ctx.scale(1 + landingSquash * 0.035, 1 - landingSquash * 0.09);
  ellipse(0, 0, 72, 34, "#8a6445");
  ctx.beginPath();
  ctx.ellipse(0, 0, 72, 34, 0, 0, Math.PI * 2);
  ctx.clip();
  if (catImg.complete && catImg.naturalWidth) {
    // Only the coat is sampled; the lying paws and floor are never drawn.
    ctx.drawImage(catImg, 155, 48, 212, 136, -73, -35, 146, 70);
  }
  ctx.restore();

  drawLeg(59, bodyY + 7, phase, true, false, airborne);
  drawLeg(159, bodyY + 7, phase + 0.15, false, false, airborne);

  // Keep this cat's original face, independently animated above the shoulders.
  ctx.save();
  ctx.translate(177, bodyY - 29 + (running ? Math.sin(phase * Math.PI * 2) * 1.8 : 0));
  ctx.rotate(airborne ? -0.07 : Math.sin(phase * Math.PI * 2 + 0.5) * 0.025);
  ctx.beginPath();
  ctx.moveTo(-41, -18);
  ctx.lineTo(-22, -48);
  ctx.lineTo(1, -40);
  ctx.lineTo(27, -47);
  ctx.lineTo(35, -14);
  ctx.bezierCurveTo(48, 18, 33, 41, 0, 40);
  ctx.bezierCurveTo(-32, 39, -49, 17, -41, -18);
  ctx.closePath();
  ctx.save();
  ctx.clip();
  if (catImg.complete && catImg.naturalWidth) {
    ctx.drawImage(catImg, 358, 0, 170, 174, -43, -48, 88, 90);
  } else {
    ellipse(0, 0, 40, 40, "#96704c");
    ellipse(-15, -3, 5, 7, "#38271e");
    ellipse(17, -3, 5, 7, "#38271e");
    ellipse(2, 12, 4, 3, "#38271e");
  }
  ctx.restore();
  // Fine whiskers flex slightly with the gait.
  ctx.strokeStyle = "rgba(235,216,181,0.65)";
  ctx.lineWidth = 0.7;
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(side * 12, 15 + i * 3);
      ctx.quadraticCurveTo(side * 29, 13 + i * 5,
        side * 48, 10 + i * 8 + Math.sin(phase * 6.28) * 1.5);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawDust() {
  for (const p of state.dust) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = "#e6d2b4";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  if (!state.startedAt) state.startedAt = now;
  const dt = Math.min(0.033, (now - (frame.prev || now)) / 1000);
  frame.prev = now;
  if (state.mode === "play") update(dt);
  else if (state.mode === "start") state.t += dt;
  else if (state.mode === "over") {
    state.catV += G * dt;
    state.catY += -state.catV * dt;
    if (state.catY < 0) { state.catY = 0; state.catV = 0; }
    state.t += dt;
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 2.2);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state.shake > 0) {
    const s = state.shake * 6;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawBackground();
  for (const o of state.obstacles) drawObstacle(o);
  drawDust();
  drawCat();
  requestAnimationFrame(frame);
}

let jumpArmed = true;
let audioCtx;
function blip(freq, dur, type) {
  try {
    audioCtx = audioCtx || new AudioContext();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

requestAnimationFrame(frame);
</script>
